<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Snake!</title>
    <style>
        body {
            background-color: #555;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 { margin-bottom: 10px; }

        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        canvas {
            background-color: #000;
            border: 2px solid #4CAF50;
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.75);
            pointer-events: none; /* Let clicks pass through when hidden */
        }

        .hidden { display: none !important; }

        #score-board {
            margin-top: 10px;
            font-size: 24px;
        }

        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            border-radius: 4px;
            pointer-events: auto;
        }

        button:hover { background-color: #45a049; }
    </style>
</head>
<body>
    <h1>🐍 SNAKEY McSNAKEFACE 🐍</h1>
    
    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <!-- Overlay for Start/Game Over -->
        <div id="ui-layer">
            <h2 id="status-text">Press Start</h2>
            <button onclick="startGame()">Start Game</button>
        </div>
    </div>

    <div id="score-board">Score: 0</div>

    <script>
        const backgroundMusic = new Audio("background.mp3");
        backgroundMusic.loop = true;
        backgroundMusic.volume = 0.2;

        const eatSound = new Audio("eat_sound1.mp3");
        eatSound.volume = 0.9;

        const endSound = new Audio("gameover.mp3");
        endSound.volume = 0.25;

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiLayer = document.getElementById('ui-layer');
        const statusText = document.getElementById('status-text');
        const scoreBoard = document.getElementById('score-board');

        // Game Constants
        const GRID_SIZE = 20;
        const TILE_COUNT = canvas.width / GRID_SIZE;
        const GAME_SPEED = 100; // Milliseconds per frame (lower is faster)

        // Game State
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = GRID_SIZE;
        let dy = 0;
        let score = 0;
        let gameInterval;
        let isGameRunning = false;
	let turnMade = false;

        // Initialize Game
        function startGame() {
            resetGame();
            uiLayer.classList.add('hidden');
            isGameRunning = true;
            gameInterval = setInterval(gameLoop, GAME_SPEED);
	    backgroundMusic.currentTime = 0;
	    backgroundMusic.play();
	    canvas.style.cursor = "none"; 
        }

        function resetGame() {
            // Start in the middle
            snake = [
                { x: 5 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 4 * GRID_SIZE, y: 10 * GRID_SIZE },
                { x: 3 * GRID_SIZE, y: 10 * GRID_SIZE }
            ];
            score = 0;
            dx = GRID_SIZE;
            dy = 0;
            updateScore();
            placeFood();
        }

        function gameLoop() {
            if (hasGameEnded()) {
                gameOver();
                return;
            }
            changeSnakePosition();
	    turnMade = false; 
            clearCanvas();
            drawFood();
            drawSnake();
        }

        function hasGameEnded() {
            // Check wall collision
            const head = snake[0];
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
                return true;
            }

            // Check self collision (loop through body, skip head)
            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return true;
                }
            }
            return false;
        }

        function changeSnakePosition() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head); // Add new head

            // Check if ate food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                updateScore();
		eatSound.currentTime = 0;
		eatSound.play();
                placeFood();
                // Don't pop the tail, so it grows
            } else {
                snake.pop(); // Remove tail
            }
        }

        function drawSnake() {
            snake.forEach((part, index) => {
	//	const green = Math.round(200 + 45 * Math.sin(index * 0.7 + Date.now() / 200));
		const green = Math.round(200 + 45 * Math.cos(index * 0.7));
        //        ctx.fillStyle = (index === 0) ? '#66BB6A' : '#4CAF50';  (original code)
		ctx.fillStyle = `rgb(50, ${green}, 70)`;
                ctx.fillRect(part.x, part.y, GRID_SIZE - 1, GRID_SIZE - 1);
            });
        }

        function drawFood() {
            ctx.fillStyle = '#FF5252';
            ctx.fillRect(food.x, food.y, GRID_SIZE - 1, GRID_SIZE - 1);
        }

        function clearCanvas() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function placeFood() {
	      const margin = (score < 100) ? 1 : 0;
              food.x = (Math.floor(Math.random() * (TILE_COUNT - margin * 2)) + margin) * GRID_SIZE;
              food.y = (Math.floor(Math.random() * (TILE_COUNT - margin * 2)) + margin) * GRID_SIZE;
  
          // Random position aligned with grid
	
//            food.x = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;
//            food.y = Math.floor(Math.random() * TILE_COUNT) * GRID_SIZE;

            // Ensure food doesn't spawn on snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    placeFood();
                }
            });
        }

        function updateScore() {
            scoreBoard.innerText = "Score: " + score;
        }

        function gameOver() {
	    backgroundMusic.pause();
	    endSound.play();
            clearInterval(gameInterval);
            isGameRunning = false;
            statusText.innerText = "Game Over 😞";
            uiLayer.classList.remove('hidden');
            canvas.style.cursor = "default";
        }

        // Input Handling
        document.body.addEventListener('keydown', keyDown);

        function keyDown(event) {
            if (!isGameRunning || turnMade) return;

            // Prevent reversing directly into self
            // Up (38) / W (87)
            if (event.keyCode === 38 || event.keyCode === 87) {
                if (dy === 0) { dx = 0; dy = -GRID_SIZE; turnMade = true;}
            }
            // Down (40) / S (83)
            else if (event.keyCode === 40 || event.keyCode === 83) {
                if (dy === 0) { dx = 0; dy = GRID_SIZE; turnMade = true;}
            }
            // Left (37) / A (65)
            else if (event.keyCode === 37 || event.keyCode === 65) {
                if (dx === 0) { dx = -GRID_SIZE; dy = 0; turnMade = true;}
            }
            // Right (39) / D (68)
            else if (event.keyCode === 39 || event.keyCode === 68) {
                if (dx === 0) { dx = GRID_SIZE; dy = 0; turnMade = true;}
            }
        }
    </script>
</body>
</html>
